<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Cairn Memory — AI memory with a source</title>
  <desc id="desc">An illustrated memory about the Harbor prototype links to its submitted source text. Inspect, correct and forget. Local SQLite and MCP, developer preview.</desc>
  <rect width="1280" height="640" fill="#f4f1e9"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#26362d">
    <rect x="48" y="44" width="42" height="42" rx="12" fill="#356d55"/>
    <path d="M57 73h24M60 65h18M65 57h8" stroke="#f4f1e9" stroke-width="5" stroke-linecap="round"/>
    <text x="107" y="75" font-size="28" font-weight="700">Cairn Memory</text>
    <rect x="984" y="43" width="248" height="42" rx="21" fill="#e3e8de"/>
    <text x="1108" y="70" text-anchor="middle" font-size="19" font-weight="600">DEVELOPER PREVIEW</text>

    <text x="48" y="213" font-size="72" font-weight="700" letter-spacing="-3">AI memory.</text>
    <text x="48" y="297" font-size="72" font-weight="700" letter-spacing="-3">With a source.</text>
    <text x="51" y="365" font-size="29">Inspect. Correct. Forget.</text>
    <text x="51" y="421" font-size="23" fill="#5d6b61">Your SQLite file. Explicit MCP tools.</text>
    <text x="51" y="456" font-size="23" fill="#5d6b61">No Cairn account needed.</text>

    <rect x="732" y="150" width="500" height="145" rx="16" fill="#fffefb" stroke="#cbd2c6" stroke-width="2"/>
    <text x="758" y="188" font-size="18" font-weight="700" fill="#356d55" letter-spacing="2">MEMORY</text>
    <text x="758" y="235" font-size="26" font-weight="600">Harbor prototype uses SQLite.</text>
    <text x="758" y="270" font-size="19" fill="#647066">Revision 1</text>
    <path d="M978 296v51" stroke="#356d55" stroke-width="3"/>
    <path d="m970 339 8 8 8-8" fill="none" stroke="#356d55" stroke-width="3"/>
    <rect x="732" y="354" width="500" height="152" rx="16" fill="#e3e8de"/>
    <text x="758" y="391" font-size="18" font-weight="700" fill="#356d55" letter-spacing="2">SOURCE RECEIPT</text>
    <text x="758" y="434" font-size="25">“The Harbor prototype</text>
    <text x="758" y="469" font-size="25">uses SQLite.”</text>

    <path d="M48 550h1184" stroke="#cbd2c6" stroke-width="2"/>
    <text x="48" y="590" font-size="24" font-weight="600">github.com/Cairn-ink/cairn-memory</text>
    <text x="1232" y="584" font-size="17" text-anchor="end" fill="#5d6b61">Illustrated example · receipt records submitted text</text>
    <text x="1232" y="613" font-size="17" text-anchor="end" fill="#5d6b61">Semantic recall uses your OpenAI key</text>
  </g>
</svg>
