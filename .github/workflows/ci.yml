name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live-evidence-offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.16.0', 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --prefix adapters/openai
      - run: npm ci --prefix adapters/mcp
      - run: npm run test:workspace-lifecycle
      - run: npm run test:live-evidence-offline

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: npm run validate

  pairing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.16.0', 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The golden comparison reads the released 0.1.1 client from history (3a1c17d9).
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      # The decision tables, the seeded sequence generator and the interruption fixtures.
      - run: npm run test:pairing
      # Parity with the released 0.1.1 client (checked-in fixture plus its sources at 3a1c17d9).
      - run: npm run test:pairing:golden

  codex:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.16.0', 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      # CX-3: parser, cursor/worker decision table, history oracle, interruptions and gates A1/A4/A5/A9.
      - run: npm run test:codex

  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.16.0', 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run test:core
      - run: npm run demo:store
      - run: npm run demo:history
      - run: npm run demo:moc
      - run: npm run demo:recall
      - run: npm run demo:admission
      # test:core includes the episode suites on both runtimes.
      - run: npm run demo:episodes
      - run: npm run demo:session-context
      - run: npm run demo:capture
      - run: npm run demo:conflicts
      - run: npm run demo:rebuild
      - run: npm run demo:continuation

  longmemeval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.16.0', 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --prefix adapters/openai
      # Reference-rendering tests invoke the runner's Python 3, standard library only.
      - run: python3 --version
      - run: npm run test:longmemeval
      - run: npm run test:long-history
      - run: npm run test:long-history-live:offline
      - run: npm run demo:longmemeval-ingestion
      - run: npm run demo:longmemeval-comparison
      - run: npm run demo:longmemeval-public
      - run: npm run demo:longmemeval-mixed

  openai-offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.16.0', 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: adapters/openai/package-lock.json
      - run: npm ci --prefix adapters/openai
      - run: npm run test:openai
      - run: npm run demo:openai-offline

  mcp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.16.0', 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: adapters/mcp/package-lock.json
      - run: npm ci --prefix adapters/mcp
      - run: npm ci --prefix adapters/openai
      - run: npm run test:mcp
      - run: node tools/testing/run.mjs --script packaging/verify-clean-cache.mjs
      - run: node tools/testing/run.mjs --script packaging/prepare-cache.mjs
      - run: npm run test:artifact
      - name: Installed rationale experiment with synthetic HTTP only
        run: CAIRN_RATIONALE_INSTALLED_OFFLINE=1 node tools/testing/run.mjs evaluation/live/test/rationale-pilot.test.mjs

  experiment-budget:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.16.0', 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run test:experiment-budget
      - run: npm run demo:experiment-budget

  experiment-request-guard:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.16.0', 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: adapters/openai/package-lock.json
      - run: npm ci --prefix adapters/openai
      - run: npm run test:experiment-request-guard
      - run: npm run demo:experiment-request-guard

  plugin-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/plugin-validation/package-lock.json
      - run: npm ci --prefix tools/plugin-validation
      - name: Validate marketplace and plugin
        run: npm run validate --prefix tools/plugin-validation
