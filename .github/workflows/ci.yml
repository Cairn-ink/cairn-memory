name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-capture:
    runs-on: macos-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.16.0', 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            adapters/mcp/package-lock.json
            adapters/openai/package-lock.json
      - name: Record macOS runner image
        run: echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - run: npm ci --prefix adapters/mcp --ignore-scripts
      - run: npm ci --prefix adapters/openai --ignore-scripts
      # The same steps that precede the local-host suite in the real job.
      - run: node integrations/client/testing/run.mjs integrations/client/test/local-source-open.test.mjs integrations/client/test/local-source-parity.test.mjs
      - run: node integrations/client/testing/run.mjs integrations/client/test/local-source-close.test.mjs
      - run: node integrations/client/testing/run.mjs --isolated-host integrations/client/test/local-macos-transport-diagnostic.test.mjs
      - run: node integrations/client/testing/run.mjs --isolated-host packages/setup/test/local-capture-interrupted.test.mjs
      - name: Full local-host suite (30 runs) with diagnostics
        shell: bash
        run: |
          set +e
          fails=0; okall=0; failall=0; diag=/tmp/cairn-diag-transport.jsonl; all="$RUNNER_TEMP/transport-all.jsonl"; : > "$all"
          for i in $(seq 1 30); do
            rm -f "$diag"; start=$(date +%s)
            if npm run test:local-host > "$RUNNER_TEMP/full-$i.log" 2>&1; then r=pass; else r=FAIL; fails=$((fails+1)); fi
            t=0; ok=0; [ -f "$diag" ] && ok=$(grep -c '"stage":"ok"' "$diag"); [ -f "$diag" ] && t=$(grep -v -c '"stage":"ok"' "$diag") && grep -v '"stage":"ok"' "$diag" | sed "s/^/{\"run\":$i,\"result\":\"$r\",\"line\":/; s/$/}/" >> "$all"
            okall=$((okall+ok)); failall=$((failall+t))
            echo "full $i: $r in $(( $(date +%s) - start )) s; DIAG $(grep -c 'DIAG ' "$RUNNER_TEMP/full-$i.log"), DIAG-HOOK $(grep -c 'DIAG-HOOK ' "$RUNNER_TEMP/full-$i.log"), unavailable $(grep -c 'capture_refused:unavailable' "$RUNNER_TEMP/full-$i.log"), transport calls ok $ok, failed $t"
            if [ "$r" = FAIL ]; then
              echo "::group::full $i failure blocks"
              awk '/^ *not ok /{p=1} p{print} p && /^ *\.\.\.$/{p=0}' "$RUNNER_TEMP/full-$i.log" | head -300
              echo "::endgroup::"
              echo "::group::full $i unexpected outcomes and transport failures"
              grep -h -E 'capture_refused:unavailable|DIAG .*"status":"(blocked|failed|busy|waiting)"|DIAG .*Stop-retry' "$RUNNER_TEMP/full-$i.log" | head -100
              [ -f "$diag" ] && grep -v '"stage":"ok"' "$diag"
              echo "::endgroup::"
            fi
          done
          echo "::group::transport failure stages across all runs (count, stage, code, uncertain, result)"
          node -e 'const fs=require("fs");const rows=fs.readFileSync(process.argv[1],"utf8").split("\n").filter(Boolean).map(l=>JSON.parse(l));const m=new Map();for(const r of rows){const k=[r.line.stage,r.line.code,r.line.syscall,r.line.exitCode,r.line.signal,r.line.uncertain,r.line.aborted,r.result].join(" ");m.set(k,(m.get(k)||0)+1)}for(const [k,v] of [...m].sort((a,b)=>b[1]-a[1]))console.log(v,k)' "$all"
          echo "::endgroup::"
          echo "transport calls across runs: ok $okall, failed $failall"; echo "full-suite failures: $fails / 30"; echo "$fails" > "$RUNNER_TEMP/fails-full"
      - name: Summary
        shell: bash
        run: |
          echo "full $(cat "$RUNNER_TEMP/fails-full")/30"
          test "$(cat "$RUNNER_TEMP/fails-full")" -eq 0
