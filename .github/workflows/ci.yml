name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-capture:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.16.0', 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            adapters/mcp/package-lock.json
            adapters/openai/package-lock.json
      - name: Record macOS runner image
        run: echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - name: Inspect dependency directory
        run: if [ -e adapters/mcp/node_modules ] || [ -L adapters/mcp/node_modules ]; then ls -ld adapters/mcp/node_modules; fi
      - run: npm ci --prefix adapters/mcp --ignore-scripts
      - name: Inspect provider dependency directory
        run: if [ -e adapters/openai/node_modules ] || [ -L adapters/openai/node_modules ]; then ls -ld adapters/openai/node_modules; fi
      - run: npm ci --prefix adapters/openai --ignore-scripts
      - name: Delayed transcript diagnostic (30 runs of the two cases)
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 30); do
            if node integrations/client/testing/run.mjs --isolated-host --import ./integrations/client/test/fixtures/local-host-observer.mjs \
                --test-name-pattern='Claude delayed transcript' integrations/client/test/local-host-setup.test.mjs > "$RUNNER_TEMP/run-$i.log" 2>&1; then
              echo "run $i: pass"
            else
              fails=$((fails+1)); echo "run $i: FAIL"
            fi
            grep -h 'DIAG ' "$RUNNER_TEMP/run-$i.log" | sed "s/^/run $i: /" || true
          done
          echo "isolated failures: $fails / 30"
      - name: Full local-host suite (3 runs) with diagnostics
        shell: bash
        run: |
          fails=0
          for i in 1 2 3; do
            if npm run test:local-host > "$RUNNER_TEMP/full-$i.log" 2>&1; then echo "full $i: pass"; else fails=$((fails+1)); echo "full $i: FAIL"; fi
            grep -h -E 'DIAG |^not ok' "$RUNNER_TEMP/full-$i.log" | sed "s/^/full $i: /" || true
          done
          echo "full-suite failures: $fails / 3"
