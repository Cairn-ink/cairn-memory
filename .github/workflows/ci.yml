name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-capture:
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.16.0', 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            adapters/mcp/package-lock.json
            adapters/openai/package-lock.json
      - name: Record macOS runner image
        run: echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - run: npm ci --prefix adapters/mcp --ignore-scripts
      - run: npm ci --prefix adapters/openai --ignore-scripts
      # The same steps that precede the local-host suite in the real job.
      - run: node integrations/client/testing/run.mjs integrations/client/test/local-source-open.test.mjs integrations/client/test/local-source-parity.test.mjs
      - run: node integrations/client/testing/run.mjs integrations/client/test/local-source-close.test.mjs
      - run: node integrations/client/testing/run.mjs --isolated-host integrations/client/test/local-macos-transport-diagnostic.test.mjs
      - run: node integrations/client/testing/run.mjs --isolated-host packages/setup/test/local-capture-interrupted.test.mjs
      - name: Full local-host suite (20 runs) with diagnostics
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 20); do
            start=$(date +%s)
            if npm run test:local-host > "$RUNNER_TEMP/full-$i.log" 2>&1; then r=pass; else r=FAIL; fails=$((fails+1)); fi
            echo "full $i: $r in $(( $(date +%s) - start )) s; DIAG lines $(grep -c 'DIAG ' "$RUNNER_TEMP/full-$i.log"), DIAG-HOOK lines $(grep -c 'DIAG-HOOK ' "$RUNNER_TEMP/full-$i.log")"
            if [ "$r" = FAIL ]; then
              echo "::group::full $i failure blocks"
              awk '/^not ok /{p=1} p{print} p && /^  \.\.\.$/{p=0}' "$RUNNER_TEMP/full-$i.log" | head -200
              echo "::endgroup::"
              echo "::group::full $i non-ready hook outcomes and unexpected Stop outcomes"
              grep -h -E 'DIAG-HOOK |DIAG .*"status":"(blocked|failed|busy|waiting)"|DIAG .*Stop-retry' "$RUNNER_TEMP/full-$i.log" | head -200
              echo "::endgroup::"
              echo "::group::full $i lines around each failure"
              grep -n -B25 -E '^not ok ' "$RUNNER_TEMP/full-$i.log" | head -300
              echo "::endgroup::"
            fi
          done
          echo "full-suite failures: $fails / 20"; echo "$fails" > "$RUNNER_TEMP/fails-full"
      - name: Summary
        shell: bash
        run: |
          echo "full $(cat "$RUNNER_TEMP/fails-full")/20"
          test "$(cat "$RUNNER_TEMP/fails-full")" -eq 0
