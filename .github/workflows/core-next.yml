name: core-next
on:
  push:
    branches: [core-next]
  pull_request:
    branches: [core-next]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.16.0", "24.22.1"]
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:prompt
      - run: npm ci --ignore-scripts
        working-directory: packages/adapter-postgres
      - run: npm test
        working-directory: packages/adapter-postgres
      - run: npm run typecheck
        working-directory: packages/adapter-postgres
