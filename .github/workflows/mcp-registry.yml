name: Publish to MCP Registry

# Manual dispatch only. Publishing lists the server on the public registry
# and every aggregator that mirrors it, and ROADMAP.md has not yet cleared
# broad promotion, so no tag or push starts this on its own. The first
# publish under io.github.cairn-ink must be done by an organization Owner
# with `mcp-publisher login github`; see docs/registry.md. Once that gate
# is lifted, a `push: tags: ["v*"]` trigger can be added here.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned mcp-publisher
        run: sh scripts/install-mcp-publisher.sh

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
